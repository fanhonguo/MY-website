# Server Configuration
server.port=8080
server.address=0.0.0.0

# Database Configuration
# Set DATABASE_URL environment variable with your PostgreSQL connection string
# Format from Coolify: postgres://username:password@host:port/database
# Example: DATABASE_URL=postgres://postgres:password@xis4en211pzt0kb1uz7btfzq:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:myDefaultSecretKeyThatIsAtLeast256BitsLongForHS512AlgorithmPleaseChangeInProduction}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
jwt.refresh-token-expiration-remember=2592000000

# CORS Configuration
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Actuator Configuration
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Spring Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
